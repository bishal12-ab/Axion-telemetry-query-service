apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-query-deployment
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-query-deployment
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: <Image>
        ports:
        - containerPort: 8000
